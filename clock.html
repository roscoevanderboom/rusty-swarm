<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .clock-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 100%;
      width: 100%;
      /* Allow dragging the entire widget */
      -webkit-app-region: drag;
    }

    .time {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      line-height: 1;
      /* Prevent drag from blocking text rendering */
      -webkit-app-region: no-drag;
    }

    .time .seconds {
      font-size: 18px;
      opacity: 0.65;
      vertical-align: super;
    }

    .date {
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      -webkit-app-region: no-drag;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.25);
      -webkit-app-region: no-drag;
    }

    .close-btn {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      -webkit-app-region: no-drag;
      line-height: 1;
    }

    body:hover .close-btn {
      opacity: 1;
    }

    .close-btn:hover {
      background: rgba(220, 60, 60, 0.75);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="time">
      <span id="hhmm">00:00</span><span class="seconds" id="ss">:00</span>
    </div>
    <div class="divider"></div>
    <div class="date" id="date">Mon, Jan 1</div>
  </div>
  <button class="close-btn" id="closeBtn" title="Close clock" aria-label="Close clock">✕</button>

  <script type="module">
    // Tauri v2 JS API
    const { getCurrentWindow } = await import("@tauri-apps/api/window");
    const win = getCurrentWindow();

    // ── Tick ────────────────────────────────────────────────────────────────
    const hhmm = document.getElementById("hhmm");
    const ss   = document.getElementById("ss");
    const dateEl = document.getElementById("date");

    const DAYS  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      hhmm.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      ss.textContent   = `:${pad(now.getSeconds())}`;
      dateEl.textContent = `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}`;
    }

    tick();
    setInterval(tick, 1000);

    // ── Close button ────────────────────────────────────────────────────────
    document.getElementById("closeBtn").addEventListener("click", () => {
      win.hide();
    });
  </script>
</body>
</html>
